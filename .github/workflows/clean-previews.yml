# Deletes old pull request previews from Cloudflare every 3 days (scripts/clean-previews.mjs says which ones). It
# touches nothing in git and never the live site: deployed versions and each open pull request's newest preview stay.
# Uses the same secrets as site.yml's deploy and preview jobs (the "cloudflare" environment); without them it skips.
#   by hand, a dry run:       gh workflow run clean-previews.yml
#   by hand, for real:        gh workflow run clean-previews.yml -f dry_run=false
#   one branch's previews:    gh workflow run clean-previews.yml -f dry_run=false -f only_alias=BRANCH_ALIAS
# A pull request that changes this file or the script runs it as a dry run.
name: clean-previews

on:
  schedule:
    - cron: '17 6 */3 * *' # 06:17 UTC on every third day of the month
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would go, delete nothing
        type: boolean
        default: true
      only_alias:
        description: Only this preview alias (the branch, as in its preview address)
        type: string
        default: ''
      keep_days:
        description: Keep previews newer than this many days
        type: number
        default: 3
  pull_request:
    paths: ['.github/workflows/clean-previews.yml', 'scripts/clean-previews.mjs', 'scripts/preview-alias.mjs']

permissions:
  contents: read
  pull-requests: read

concurrency: clean-previews

jobs:
  clean:
    runs-on: ubuntu-latest
    environment: cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # the open pull requests' branches: their newest preview stays
      - run: gh pr list --state open --limit 500 --json headRefName --jq '.[].headRefName' > "$RUNNER_TEMP/open-branches.txt"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - run: node scripts/clean-previews.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPEN_BRANCHES: ${{ runner.temp }}/open-branches.txt
          # the schedule deletes; by hand it deletes only when dry_run is unticked; a pull request never does
          DRY_RUN: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) && 'false' || 'true' }}
          ONLY_ALIAS: ${{ inputs.only_alias }}
          KEEP_DAYS: ${{ inputs.keep_days || 3 }}
