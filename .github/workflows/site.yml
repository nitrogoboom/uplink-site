# Build and check on every push and pull request (types, the build scripts' tests, lint, build, then the built site
# in a browser: tools/verify_footer.py and the link check; on a pull request also a screenshot comparison with the
# live site); deploy to the Cloudflare Worker on main only if all of that passed.
# Actions are pinned to a commit (the # vX.Y.Z beside each says which release), so a moved tag can't change what
# runs here; Dependabot (.github/dependabot.yml) proposes the updates.
# Deploying needs two secrets in the "cloudflare" environment: CLOUDFLARE_API_TOKEN (a token with
# "Workers Scripts: Edit") and CLOUDFLARE_ACCOUNT_ID. Until both are set, the deploy and preview jobs are
# skipped (the run stays green and says "skipped"); the build still tells you if the site is sound.
name: site

# the notes (root Markdown, docs/, knowledge/) aren't part of the site, so a change to only those
# runs nothing and deploys nothing (src/data/*.md are part of the site and still count)
on:
  push:
    branches: [main]
    paths-ignore: ['*.md', 'docs/**', 'knowledge/**']
  pull_request:
    paths-ignore: ['*.md', 'docs/**', 'knowledge/**']
  workflow_dispatch: # "Run workflow" in the Actions tab, or: gh workflow run site.yml --ref <branch>

permissions:
  contents: read

# a new push to a pull request stops that pull request's older run; runs on main always finish
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: cloudflare # so the step below can see whether the deploy secrets exist
    outputs:
      cloudflare: ${{ steps.cf.outputs.ready }}
    steps:
      - id: cf
        run: echo "ready=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the sitemap's lastmod dates come from git history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run lint
      - run: npm run build
      # open the built site in a browser, served the way Cloudflare serves it (headers, CSP, 404), before anything
      # deploys: tools/verify_footer.py fails on a script error, a CSP block, a dead hero or Grow section, sideways scroll,
      # or a serious axe finding (Home in full, the other pages once at phone size)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install "$(grep -i "^playwright==" requirements.txt)" "$(grep -i "^pillow==" requirements.txt)" && python -m playwright install --with-deps chromium
      - name: Check the built site in a browser
        run: |
          npx wrangler dev --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 60); do curl -sf http://localhost:8787/ > /dev/null && break; sleep 1; done
          curl -sf http://localhost:8787/ > /dev/null || { cat wrangler.log; exit 1; }
          mkdir -p out && python tools/verify_footer.py out/
          python tools/check_links.py
          # a pull request: each page next to the live site (main) at three sizes. It reports, it never fails: a
          # person reads the list in the run's summary and says whether each change was meant
          if [ "$EVENT" = pull_request ]; then
            python tools/visual_diff.py https://uplink-site.johnoreilly.workers.dev http://localhost:8787 || true
            cat out/visual/report.md >> "$GITHUB_STEP_SUMMARY" || true
          fi
        env:
          WRANGLER_SEND_METRICS: 'false'
          EVENT: ${{ github.event_name }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-check
          path: |
            out/*.png
            wrangler.log
          retention-days: 7
      - if: github.event_name == 'pull_request' && hashFiles('out/visual/*.png') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diff
          path: out/visual
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          include-hidden-files: true # dist/.well-known/security.txt: upload-artifact skips dot folders by default
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'push' && needs.build.outputs.cloudflare == 'true'
    runs-on: ubuntu-latest
    environment: cloudflare
    concurrency: deploy # two quick pushes deploy one after the other, in order
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      # only wrangler is needed here, at the version in package-lock.json, so no full npm ci
      - run: echo "WRANGLER=wrangler@$(node -p "require('./package-lock.json').packages['node_modules/wrangler'].version")" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: npx --yes "$WRANGLER" deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # a pull request gets a preview address (wrangler prints it) without touching the live Worker
  preview:
    needs: build
    if: github.event_name == 'pull_request' && needs.build.outputs.cloudflare == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment: cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: echo "WRANGLER=wrangler@$(node -p "require('./package-lock.json').packages['node_modules/wrangler'].version")" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # the alias is the branch name, so every push to a branch keeps the same address
      - id: upload
        run: |
          alias=$(printf '%s' "$BRANCH" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9' '-' | sed 's/--*/-/g; s/^-//; s/-$//' | cut -c1-30 | sed 's/-$//')
          npx --yes "$WRANGLER" versions upload --preview-alias "$alias" | tee upload.log
          echo "version=$(grep -o 'https://[^ ]*workers\.dev' upload.log | grep -v "^https://$alias-" | head -1)" >> "$GITHUB_OUTPUT"
          echo "branch=$(grep -o "https://$alias-[^ ]*workers\.dev" upload.log | head -1)" >> "$GITHUB_OUTPUT"
        env:
          BRANCH: ${{ github.head_ref }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # one comment on the pull request with the address, updated on each push
      - run: |
          body=$(printf '**Preview:** %s\n\nThis push only: %s\n' "${BRANCH_URL:-$VERSION_URL}" "$VERSION_URL")
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --body "$body" --edit-last --create-if-none
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH_URL: ${{ steps.upload.outputs.branch }}
          VERSION_URL: ${{ steps.upload.outputs.version }}
