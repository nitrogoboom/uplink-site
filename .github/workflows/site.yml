# Draft mode. A pull request: build (dist) and preview, in parallel; the gate (`build`, required on main) passes when
# dist does. A push to main, or "Run workflow" on main: deploy builds and runs scripts/deploy.mjs (smoke check at the
# new version's address, then live, rollback on failure). Nothing else is checked here: site checks are done by hand,
# when the owner asks (the `check` skill).
# node_modules is cached by package-lock.json, so npm ci runs only when the packages change (57 s otherwise).
# Actions are pinned to a commit; Dependabot updates them. Secrets in the "cloudflare" environment:
# CLOUDFLARE_API_TOKEN ("Workers Scripts: Edit") and CLOUDFLARE_ACCOUNT_ID.
name: site

# a push to main of only notes (root Markdown, docs/, .claude/, any README.md) runs nothing
on:
  push:
    branches: [main]
    paths-ignore: ['*.md', 'docs/**', '.claude/**', '**/README.md']
  pull_request: # always runs, so the required `build` check reports; a docs-only one passes in seconds
  workflow_dispatch: # "Run workflow" on main: deploy again (when a push's run was lost)

permissions:
  contents: read

defaults:
  run:
    shell: bash # -e -o pipefail

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # the build; a docs-only pull request skips it
  dist:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # docs-only test; the sitemap's lastmod dates
          persist-credentials: false
      - id: s
        run: |
          docs=false
          if ! git diff --name-only "$BASE...$HEAD" | grep -qvE '^([^/]+\.md|docs/.*)$'; then docs=true; fi
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "docs only: $docs" >> "$GITHUB_STEP_SUMMARY"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
      - if: steps.s.outputs.docs != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - if: steps.s.outputs.docs != 'true'
        id: nm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-prod-${{ runner.os }}-${{ hashFiles('.node-version', 'package-lock.json') }}
      - if: steps.s.outputs.docs != 'true' && steps.nm.outputs.cache-hit != 'true'
        run: npm ci --omit=dev # the build and deploy packages; lint and type tools stay on the owner's machine
      - if: steps.s.outputs.docs != 'true'
        run: npm run build

  # the gate the ruleset on main requires. always(), so a failed build fails it rather than skipping it
  build:
    needs: [dist]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: '[ "$DIST" = success ] || { echo "::error::dist: $DIST"; exit 1; }'
        env:
          DIST: ${{ needs.dist.result }}

  # a push to main, or "Run workflow" on main: build here, then scripts/deploy.mjs (upload a version, smoke it at its own address, put it live,
  # smoke the live site, roll back on failure). Missing secrets fail it. One deploy at a time
  deploy:
    needs: workflows # a high zizmor finding stops the deploy
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30 # about 1 minute; up to 25 when smoke runs retry
    environment: cloudflare
    concurrency: deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the sitemap's lastmod dates
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: nm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-prod-${{ runner.os }}-${{ hashFiles('.node-version', 'package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci --omit=dev # the build and deploy packages; lint and type tools stay on the owner's machine
      - run: npm run build
      - name: Upload, check, deploy (rolled back if the live site then fails its smoke check)
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::cloudflare environment is missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          node scripts/deploy.mjs https://uplink-site.johnoreilly.workers.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'

  # a pull request's preview, https://pr-N-uplink-site.johnoreilly.workers.dev: builds the commit itself and waits
  # for no job. Skipped for a docs-only pull request or missing secrets
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # the preview address goes in a comment on the pull request
    environment: cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the docs-only test below, and the sitemap's lastmod dates
          persist-credentials: false
      - id: go
        run: |
          go=true
          if ! git diff --name-only "$BASE...$HEAD" | grep -qvE '^([^/]+\.md|docs/.*)$'; then go=false; echo "docs only: no preview"; fi
          if [ "$READY" != true ]; then go=false; echo "no Cloudflare secrets: no preview" >> "$GITHUB_STEP_SUMMARY"; fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      - if: steps.go.outputs.go == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - if: steps.go.outputs.go == 'true'
        id: nm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-prod-${{ runner.os }}-${{ hashFiles('.node-version', 'package-lock.json') }}
      - if: steps.go.outputs.go == 'true' && steps.nm.outputs.cache-hit != 'true'
        run: npm ci --omit=dev # the build and deploy packages; lint and type tools stay on the owner's machine
      - if: steps.go.outputs.go == 'true'
        run: npm run build
      # Worker Preview named pr-N; the JSON starts at the first line that is "{"
      - id: upload
        if: steps.go.outputs.go == 'true'
        run: |
          npx wrangler preview --name "pr-$PR" --message "$SHA" --json > preview.out || { cat preview.out; exit 1; }
          cat preview.out
          url=$(sed -n '/^{/,$p' preview.out | jq -er '.preview.urls[0]')
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
      # one comment on the pull request with the address, updated on each push
      - if: steps.go.outputs.go == 'true'
        run: |
          body=$(printf '**Preview:** %s\n' "$URL")
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --body "$body" --edit-last --create-if-none
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.upload.outputs.url }}

  # zizmor: fails on a high-severity workflow finding
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run --spec zizmor==1.31.1 zizmor --min-severity high --format github .github/workflows
        env:
          GH_TOKEN: ${{ github.token }} # its online audits (known-vulnerable actions, moved tags) read public repositories

  # new dependencies with a known high vulnerability fail a pull request (public repositories only)
  dependency-review:
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
