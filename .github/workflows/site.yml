# Draft mode (CLAUDE.md, "Checking a change"). A pull request: the build (dist), beside it types, the build scripts'
# tests and lint (static), and a preview that builds on its own runner so its link comes first. The browser checks
# (core; verify: the site check split across three runners plus the link and header checks; visual-diff: a screenshot
# comparison with the live site) run only with the "full-checks" label or from "Run workflow". The build job is the
# gate over all of them, the required check on main. A push to main builds and deploys, nothing else: deploy puts
# live only a version that passes the smoke check at its own address first, and rolls back if the live site then
# fails it (scripts/deploy.mjs). The drawings are checked locally when one changes (python tools/regen.py --check), not
# here: only the owner and the agent change them, by hand, and the site serves the committed SVGs as they are.
# The workflows themselves are linted (zizmor); a pull request's new dependencies are reviewed where GitHub offers it.
# Actions are pinned to a commit (the # vX.Y.Z beside each says which release), so a moved tag can't change what
# runs here; Dependabot (.github/dependabot.yml) proposes the updates.
# Deploying needs two secrets in the "cloudflare" environment: CLOUDFLARE_API_TOKEN (a token with
# "Workers Scripts: Edit") and CLOUDFLARE_ACCOUNT_ID. Without them a pull request's preview is skipped (its run
# stays green and says "skipped"), but a push to main fails: it would otherwise look deployed when it isn't.
name: site

# the notes (root Markdown, docs/, .claude/, any README.md) aren't part of the site, so a change to only those
# runs nothing and deploys nothing (src/data/*.md are part of the site and still count)
on:
  push:
    branches: [main]
    paths-ignore: ['*.md', 'docs/**', '.claude/**', '**/README.md']
  pull_request: # every pull request runs, so the required `build` check always reports; a docs-only one passes in seconds (scope)
    types: [opened, synchronize, reopened, labeled] # labeled: adding "full-checks" runs the browser checks
  workflow_dispatch: # "Run workflow" in the Actions tab, or: gh workflow run site.yml --ref <branch>

permissions:
  contents: read

# every run step in bash with -e -o pipefail, so `wrangler … | tee log` fails when wrangler does (the runner's own
# default for a step without `shell` has no pipefail)
defaults:
  run:
    shell: bash

# a new push to a pull request stops that pull request's older run. On main a run that has started finishes, but
# GitHub keeps only one waiting run per group: a third quick push replaces the second while it waits, and the newest
# one checks and deploys everything up to it
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # the browser checks (core, verify, visual-diff) run only on a pull request with the "full-checks" label, or from
  # "Run workflow" (workflow_dispatch; core and verify). Never for a path. A push to main runs none of them
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.s.outputs.full }}
      visual: ${{ steps.s.outputs.visual }}
      docs: ${{ steps.s.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: s
        run: |
          full=false; visual=false; docs=false
          # a pull request that changes only root Markdown, docs/, .claude/ or a README.md: nothing to build or check, `build` passes at once
          if [ "$EVENT" = pull_request ] && ! git diff --name-only "$BASE...$HEAD" | grep -qvE '^([^/]+\.md|docs/.*)$'; then docs=true; fi
          if [ "$EVENT" = workflow_dispatch ] || [ "$LABELLED" = true ]; then full=true; fi
          if [ "$LABELLED" = true ]; then visual=true; fi
          if [ "$docs" = true ]; then full=false; visual=false; fi
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "visual=$visual" >> "$GITHUB_OUTPUT"
          echo "docs only: $docs, browser checks: $full, screenshot comparison: $visual" >> "$GITHUB_STEP_SUMMARY"
        env:
          EVENT: ${{ github.event_name }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'full-checks') }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

  # the build, once: its dist/ is what every check below opens and what deploy puts live
  dist:
    needs: scope
    if: needs.scope.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # about 2 minutes
    environment: cloudflare # so the step below can see whether the deploy secrets exist
    outputs:
      cloudflare: ${{ steps.cf.outputs.ready }}
    steps:
      - id: cf
        run: echo "ready=$READY" >> "$GITHUB_OUTPUT"
        env:
          READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the sitemap's lastmod dates come from git history
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          include-hidden-files: true # dist/.well-known/security.txt: upload-artifact skips dot folders by default
          retention-days: 7

  # beside the build: types, the build scripts' tests, lint. Not on a push to main: its pull request ran them
  static:
    needs: scope
    if: github.event_name != 'push' && needs.scope.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # about 2 minutes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run lint

  # the core: the site check's tests tagged @core (checks/site.spec.mjs: no script error or CSP block, no sideways
  # scroll at 390 and 1280, axe in both themes, the path without script, pop-ups closing), against the built site
  # served by wrangler dev. With the browser checks only (scope: full), beside verify; about 4 minutes for the job
  core:
    needs: [dist, scope]
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # about 2 minutes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run the core browser tests
        run: |
          npx wrangler dev --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 60); do curl -sf http://localhost:8787/ > /dev/null && break; sleep 1; done
          curl -sf http://localhost:8787/ > /dev/null || { cat wrangler.log; exit 1; }
          npm run verify:core
        env:
          WRANGLER_SEND_METRICS: 'false'
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-check
          path: |
            out/test-results
            wrangler.log
          retention-days: 7

  # open the built site in a browser, served the way Cloudflare serves it (headers, CSP, 404), before anything
  # deploys: the site check (checks/site.spec.mjs) fails on a script error, a CSP block, a dead hero or Grow section,
  # sideways scroll, a pop-up that doesn't show, or a serious axe finding. It's split in three (Playwright's --shard),
  # each part on its own runner; the first part also runs the link check and the smoke check on the headers.
  # Playwright's Chromium is kept between runs, for as long as package-lock.json names the same @playwright/test
  # (the browser build goes with that version); the system libraries it needs are installed each time
  verify:
    needs: [dist, scope]
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20 # about 3 minutes
    strategy:
      fail-fast: false # every shard reports, so one run shows every failure
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Check the built site in a browser
        run: |
          npx wrangler dev --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 60); do curl -sf http://localhost:8787/ > /dev/null && break; sleep 1; done
          curl -sf http://localhost:8787/ > /dev/null || { cat wrangler.log; exit 1; }
          npm run verify -- -- --shard="$SHARD/3"
          if [ "$SHARD" = 1 ]; then
            npm run verify:links
            npm run smoke -- http://localhost:8787
          fi
        env:
          WRANGLER_SEND_METRICS: 'false'
          SHARD: ${{ matrix.shard }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-check-${{ matrix.shard }}
          path: |
            out/*.png
            out/test-results
            wrangler.log
          retention-days: 7

  # a pull request: each page next to the live site (main) at three sizes. It reports, it never fails: a person reads
  # the list in the run's summary and says whether each change was meant
  visual-diff:
    needs: [dist, scope]
    if: github.event_name == 'pull_request' && needs.scope.outputs.visual == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # about 2 minutes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Compare each page with the live site
        run: |
          npx wrangler dev --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 60); do curl -sf http://localhost:8787/ > /dev/null && break; sleep 1; done
          curl -sf http://localhost:8787/ > /dev/null || { cat wrangler.log; exit 1; }
          npm run visual-diff -- https://uplink-site.johnoreilly.workers.dev http://localhost:8787 || true
          cat out/visual/report.md >> "$GITHUB_STEP_SUMMARY" || true
        env:
          WRANGLER_SEND_METRICS: 'false'
      - if: hashFiles('out/visual/*.png') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diff
          path: out/visual
          retention-days: 14

  # the gate, under the name the ruleset on main requires (`build`), and what deploy waits for. It passes
  # only when the build and (not on a push to main) the static checks passed, every verify shard passed when the
  # browser checks ran, and no other check that ran failed or was cancelled. always(), so it reports even when one of them failed (a
  # skipped required check would count as passed)
  build:
    needs: [scope, dist, static, core, verify, visual-diff]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cloudflare: ${{ needs.dist.outputs.cloudflare }}
    steps:
      - name: Every check passed
        run: |
          # the browser checks may be skipped on purpose (the scope job); skipped is fine, failed or cancelled isn't.
          # A docs-only pull request skips everything after scope and passes here
          [ "$SCOPE" = success ] || { echo "::error::scope: $SCOPE"; exit 1; }
          if [ "$DOCS" = true ]; then echo "docs only: nothing to build"; exit 0; fi
          [ "$DIST" = success ] || { echo "::error::dist: $DIST"; exit 1; }
          if [ "$EVENT" != push ] && [ "$STATIC" != success ]; then echo "::error::static: $STATIC"; exit 1; fi
          if [ "$FULL" = true ] && [ "$VERIFY" != success ]; then echo "::error::verify: $VERIFY"; exit 1; fi
          for r in "core=$CORE" "verify=$VERIFY" "visual-diff=$VISUAL"; do
            case "${r#*=}" in success | skipped) ;; *) echo "::error::${r%%=*}: ${r#*=}"; exit 1 ;; esac
          done
        env:
          SCOPE: ${{ needs.scope.result }}
          DOCS: ${{ needs.scope.outputs.docs }}
          FULL: ${{ needs.scope.outputs.full }}
          DIST: ${{ needs.dist.result }}
          STATIC: ${{ needs.static.result }}
          CORE: ${{ needs.core.result }}
          EVENT: ${{ github.event_name }}
          VERIFY: ${{ needs.verify.result }}
          VISUAL: ${{ needs.visual-diff.result }}
      # a push to main that can't deploy fails, after the checks above have had their say
      - if: github.event_name == 'push' && needs.dist.outputs.cloudflare != 'true'
        run: |
          echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing from the cloudflare environment, so this push to main can't deploy"
          echo "**Not deployed:** the cloudflare environment is missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID." >> "$GITHUB_STEP_SUMMARY"
          exit 1

  deploy:
    needs: [build, workflows] # a high zizmor finding stops the deploy too
    # each result named: the build gate runs always(), and a job skipped further up (visual-diff, on a push) would
    # otherwise skip this one too. The gate itself passes only when every check before it passed
    if: >-
      !cancelled() && github.event_name == 'push' && needs.build.outputs.cloudflare == 'true' &&
      needs.build.result == 'success' && needs.workflows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30 # about 2 minutes; at worst about 25: each smoke run may take up to 5 and the live one can run twice, and the wait for the live build up to 2
    environment: cloudflare
    # a deploy that has started finishes; the next waits for it. GitHub keeps one waiting deploy, so a third quick
    # push replaces the second while it waits, and the newest build is the one that goes live
    concurrency: deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      # wrangler and everything under it exactly as package-lock.json has them; the token is handed to the wrangler
      # step alone. Install scripts: npm 11 (Node 24) runs them all and warns about any not in package.json's
      # allowScripts; npm 12 runs only those
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # upload a new version that takes no traffic, smoke check it at its own address, only then put it live; once the
      # live address serves that build, smoke check it, and roll back to the version from before if it never serves it
      # or fails (scripts/deploy.mjs, review H3). The smoke runs don't get the Cloudflare secrets. Every step's result
      # is in the run's summary
      - name: Upload, check, deploy (rolled back if the live site then fails its smoke check)
        run: node scripts/deploy.mjs https://uplink-site.johnoreilly.workers.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'

  # a pull request gets a preview address (wrangler prints it) without touching the live Worker. It waits for no other
  # job: it builds the same commit itself, so the link doesn't wait for scope, dist's upload or a second npm ci, nor
  # for lint, types, tests or the browser checks. A preview can so exist for a pull request whose checks then fail;
  # the gate (build) still decides whether it merges. Its steps skip (the job stays green) for a docs-only pull
  # request, by the same rule as scope, and when the Cloudflare secrets are missing
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # the preview address goes in a comment on the pull request
    environment: cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the docs-only test below, and the sitemap's lastmod dates
          persist-credentials: false
      - id: go
        run: |
          go=true
          if ! git diff --name-only "$BASE...$HEAD" | grep -qvE '^([^/]+\.md|docs/.*)$'; then go=false; echo "docs only: no preview"; fi
          if [ "$READY" != true ]; then go=false; echo "no Cloudflare secrets: no preview" >> "$GITHUB_STEP_SUMMARY"; fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      - if: steps.go.outputs.go == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - if: steps.go.outputs.go == 'true'
        run: npm ci # as in deploy: wrangler from package-lock.json
      - if: steps.go.outputs.go == 'true'
        run: npm run build
      # a Worker Preview (wrangler preview, https://developers.cloudflare.com/workers/previews/), named after the pull
      # request: pr-N, so every push keeps the same address, https://pr-N-uplink-site.johnoreilly.workers.dev.
      # Cloudflare keeps 100 previews and drops the one deployed to longest ago. Wrangler prints its own lines (the
      # build command, the asset upload) before the JSON, so the JSON is read from the first line that is "{"; no
      # address in it fails the step, rather than posting an empty link
      - id: upload
        if: steps.go.outputs.go == 'true'
        run: |
          npx wrangler preview --name "pr-$PR" --message "$SHA" --json > preview.out || { cat preview.out; exit 1; }
          cat preview.out
          url=$(sed -n '/^{/,$p' preview.out | jq -er '.preview.urls[0]')
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
      # one comment on the pull request with the address, updated on each push
      - if: steps.go.outputs.go == 'true'
        run: |
          body=$(printf '**Preview:** %s\n' "$URL")
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --body "$body" --edit-last --create-if-none
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.upload.outputs.url }}

  # the workflows themselves: zizmor (https://docs.zizmor.sh) fails on any high-severity finding, such as a template
  # injection or an unpinned action
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run --spec zizmor==1.31.1 zizmor --min-severity high --format github .github/workflows
        env:
          GH_TOKEN: ${{ github.token }} # its online audits (known-vulnerable actions, moved tags) read public repositories

  # a pull request's new or changed dependencies: known vulnerabilities (high and above) fail it. The repository is
  # public (since November 7, 2026), where GitHub offers this; a private one needs GitHub Advanced Security, so the job
  # skips itself if the repository goes private again
  dependency-review:
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
