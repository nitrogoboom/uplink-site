# Build and check on every push and pull request; deploy to the Cloudflare Worker on main.
# Deploying needs two secrets in the "cloudflare" environment: CLOUDFLARE_API_TOKEN (a token with
# "Workers Scripts: Edit") and CLOUDFLARE_ACCOUNT_ID. Until both are set, the deploy and preview jobs are
# skipped (the run stays green and says "skipped"); the build still tells you if the site is sound.
name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # "Run workflow" in the Actions tab, or: gh workflow run site.yml --ref <branch>

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: cloudflare # so the step below can see whether the deploy secrets exist
    outputs:
      cloudflare: ${{ steps.cf.outputs.ready }}
    steps:
      - id: cf
        run: echo "ready=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the sitemap's lastmod dates come from git history
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'push' && needs.build.outputs.cloudflare == 'true'
    runs-on: ubuntu-latest
    environment: cloudflare
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # a pull request gets a preview address (wrangler prints it) without touching the live Worker
  preview:
    needs: build
    if: github.event_name == 'pull_request' && needs.build.outputs.cloudflare == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment: cloudflare
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      # the alias is the branch name, so every push to a branch keeps the same address
      - id: upload
        run: |
          alias=$(printf '%s' "$BRANCH" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9' '-' | sed 's/--*/-/g; s/^-//; s/-$//' | cut -c1-30 | sed 's/-$//')
          npx wrangler versions upload --preview-alias "$alias" | tee upload.log
          echo "version=$(grep -o 'https://[^ ]*workers\.dev' upload.log | grep -v "^https://$alias-" | head -1)" >> "$GITHUB_OUTPUT"
          echo "branch=$(grep -o "https://$alias-[^ ]*workers\.dev" upload.log | head -1)" >> "$GITHUB_OUTPUT"
        env:
          BRANCH: ${{ github.head_ref }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # one comment on the pull request with the address, updated on each push
      - run: |
          body=$(printf '**Preview:** %s\n\nThis push only: %s\n' "${BRANCH_URL:-$VERSION_URL}" "$VERSION_URL")
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --body "$body" --edit-last --create-if-none
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH_URL: ${{ steps.upload.outputs.branch }}
          VERSION_URL: ${{ steps.upload.outputs.version }}
