# Monthly dependency updates (weekly until November 9, 2026: each one ran full CI during the draft). Minor and patch bumps come as one pull request; a major gets its own.
# cooldown: a release is proposed only once it is a week old (5 days for an npm or pip patch; Actions take one wait only), so a hijacked or broken release
# has time to be found and pulled before it reaches this repository.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-patch-days: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # TypeScript 7: astro check refuses it ("does not currently support TypeScript 7.0", November 8, 2026). Drop this
    # once @astrojs/check supports it, or the site moves to @astrojs/ts-content-mapper.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
  # requirements.in, locked into requirements.txt with hashes (uv pip compile): the drawing tools, which CI's drawings job installs
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-patch-days: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
