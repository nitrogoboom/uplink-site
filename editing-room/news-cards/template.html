<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uplink News Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&family=Barlow:wght@400;600&display=swap">
<style>
/* The home hero's two news cards, today and three layouts, at the widths they show on the site:
   desktop 1440 (two cards, 368 px each) and phone 390 (one card, 358 px). The site's own tokens, dark only. */
:root {
  color-scheme: dark;
  --c-bg: #0E1A27; --c-surface: rgb(242 247 252 / 0.05); --c-surface-2: rgb(242 247 252 / 0.09); --c-well: rgb(0 0 0 / 0.18);
  --c-line: rgb(242 247 252 / 0.1); --c-line-2: rgb(242 247 252 / 0.18);
  --c-text: #F2F7FC; --c-muted: #BBC2C9; --c-accent: #FFAD51; --c-on-accent: #0E1A27; --c-accent-text: #FFAD51;
  --c-sky: #97C8EA; --c-sky-tint: rgb(151 200 234 / 0.16);
  --font-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --font-body: 'Barlow', 'Segoe UI', Arial, sans-serif;
  --fs-1: 0.75rem; --fs-2: 0.875rem; --fs-3: 1rem; --fs-4: 1.125rem; --fs-6: 1.75rem; --fs-8: 2.75rem;
  --lh-display: 0.95; --lh-tight: 1; --lh-title: 1.1; --lh-snug: 1.3; --lh-body: 1.6;
  --tracking-1: 0.02em; --tracking-3: 0.08em; --tracking-label: 0.12em;
  --sp-1: 0.25rem; --sp-2: 0.5rem; --sp-3: 0.75rem; --sp-4: 1rem; --sp-5: 1.5rem; --sp-6: 2rem; --sp-7: 3rem; --sp-8: 4rem; --sp-9: 6rem;
  --r-2: 0.25rem; --r-3: 0.5rem; --r-pill: 999px;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1); --dur-2: 250ms;
}
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }
body { background: var(--c-bg); color: var(--c-text); font-family: var(--font-body); font-size: var(--fs-3); line-height: var(--lh-body); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--c-accent-text); outline-offset: 2px; }

/* ---------- the page ---------- */
.wrap { max-width: 64rem; margin-inline: auto; padding: var(--sp-7) 16px var(--sp-8); display: grid; gap: var(--sp-7); }
.intro { display: grid; gap: var(--sp-3); }
.intro h1 { font-family: var(--font-display); font-weight: 700; font-style: italic; text-transform: uppercase; font-size: clamp(2.25rem, 1.6rem + 3vw, var(--fs-8)); line-height: var(--lh-display); }
.intro h1 em { font-style: inherit; color: var(--c-accent-text); }
.intro p { color: var(--c-muted); max-width: 44rem; }
.opt { display: grid; gap: var(--sp-4); padding-top: var(--sp-6); border-top: 1px solid var(--c-line); }
.opt-head { display: grid; gap: var(--sp-1); }
.opt-head h2 { font-family: var(--font-display); font-weight: 700; font-style: italic; text-transform: uppercase; font-size: var(--fs-6); line-height: var(--lh-title); }
.opt-head h2 b { color: var(--c-accent-text); font-weight: inherit; }
.opt-head p { color: var(--c-muted); max-width: 46rem; }
.sizes { display: flex; flex-wrap: wrap; gap: var(--sp-6); align-items: flex-start; }
.size { display: grid; gap: var(--sp-2); }
.size-label { font-size: var(--fs-1); font-weight: 600; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--c-muted); }
.size-label span { color: var(--c-text); }
.dock { display: grid; gap: var(--sp-5); }
.dock.desk { grid-template-columns: repeat(2, 23rem); }
.dock.phone { grid-template-columns: 22.375rem; gap: var(--sp-4); }
@media (max-width: 52rem) { .dock.desk { grid-template-columns: minmax(0, 23rem); } .dock.phone { grid-template-columns: minmax(0, 22.375rem); } }

/* ---------- the site's card, chip, well (surfaces.css, buttons.css) ---------- */
.card { display: flex; flex-direction: column; gap: var(--sp-4); padding: var(--sp-3); background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-3); color: var(--c-text); text-decoration: none; transition: transform var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease), background-color var(--dur-2) var(--ease); }
@media (hover: hover) { .card:hover { transform: translateY(-3px); border-color: var(--c-line-2); background: var(--c-surface-2); } }
.well { background: var(--c-well); border-radius: var(--r-2); }
.chip { display: inline-flex; align-items: center; align-self: flex-start; height: var(--sp-5); padding-inline: var(--sp-3); border-radius: var(--r-pill); background: var(--c-surface-2); font-size: var(--fs-1); font-weight: 600; letter-spacing: var(--tracking-3); line-height: var(--lh-tight); text-transform: uppercase; white-space: nowrap; }
.chip--accent { background: var(--c-accent); color: var(--c-on-accent); }
.chip--sky { background: var(--c-sky-tint); color: var(--c-sky); }
.small { font-size: var(--fs-2); }
.muted { color: var(--c-muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.news-title { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-4); letter-spacing: var(--tracking-1); line-height: var(--lh-title); text-transform: uppercase; }
.news-thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }

/* ---------- Now: hero.css today ---------- */
.v-now .news { flex-direction: row; align-items: flex-start; gap: var(--sp-4); }
.v-now .news-thumb { flex: none; display: grid; place-items: center; width: var(--sp-9); aspect-ratio: 4 / 3; overflow: hidden; }
.v-now .news-text { display: flex; flex-direction: column; gap: var(--sp-1); min-width: 0; text-wrap: pretty; }
.v-now .news-text .chip { order: -1; }

/* Round 2: the rules every option keeps.
   1. One spacing value inside the card (--sp-4), on every side and between picture and words.
   2. The picture is as tall as the card: no blank under it, however long the words run.
   3. Label, title and line are one block, centred top to bottom beside the picture.
   4. Cards in a row are the same height (the dock is a grid; cards stretch). */
.v-a .news, .v-b .news, .v-c .news { flex-direction: row; align-items: stretch; gap: var(--sp-4); }
.v-a .news-text, .v-b .news-text, .v-c .news-text { display: flex; flex-direction: column; justify-content: center; gap: var(--sp-1); min-width: 0; text-wrap: pretty; }
.v-a .news-text .chip, .v-b .news-text .chip { order: -1; margin-bottom: var(--sp-1); }

/* ---------- A: picture framed inside the card ---------- */
.v-a .news { padding: var(--sp-3); }
.v-a .news-thumb { flex: none; width: calc(var(--sp-8) + var(--sp-6)); align-self: stretch; overflow: hidden; display: grid; place-items: center; padding: var(--sp-2); }
.v-a .news-thumb img { height: auto; max-height: 100%; }

/* ---------- B: picture as a panel, edge to edge on the left ---------- */
.v-b .news { padding: 0; overflow: hidden; }
.v-b .news-thumb { flex: none; width: calc(var(--sp-9) + var(--sp-5)); border-radius: 0; border-right: 1px solid var(--c-line); display: grid; place-items: center; padding: var(--sp-3); }
.v-b .news-thumb img { height: auto; max-height: 100%; }
.v-b .news-text { padding: var(--sp-4) var(--sp-4) var(--sp-4) 0; }

/* ---------- C: as B, the pill swapped for a coloured label (one line less) ---------- */
.v-c .news { padding: 0; overflow: hidden; }
.v-c .news-thumb { flex: none; width: calc(var(--sp-9) + var(--sp-5)); border-radius: 0; border-right: 1px solid var(--c-line); display: grid; place-items: center; padding: var(--sp-3); }
.v-c .news-thumb img { height: auto; max-height: 100%; }
.v-c .news-text { padding: var(--sp-4) var(--sp-4) var(--sp-4) 0; }
.tag { order: -1; display: inline-flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-1); font-weight: 600; letter-spacing: var(--tracking-label); line-height: var(--lh-snug); text-transform: uppercase; }
.tag::before { content: ""; width: var(--sp-2); height: var(--sp-2); border-radius: 50%; background: currentColor; }
.tag--accent { color: var(--c-accent-text); }
.tag--sky { color: var(--c-sky); }

.measure { font-size: var(--fs-1); color: var(--c-muted); }
.measure b { color: var(--c-text); font-weight: 600; }
</style>
</head>
<body>
<main class="wrap">
  <header class="intro">
    <h1>Home hero · <em>news cards</em></h1>
    <p>The two cards under the office drawing. Each option shows them at the size they are on a 1440 desktop (two side
      by side) and on a phone (one, full width). Hover works. The line under each says how tall the cards are; shorter
      helps the hero fit one screen.</p>
  </header>

  <!--OPTIONS-->
</main>
<script>
// Fill each option from the two cards, then measure.
const NEWS = [
  { img: 'security', chip: 'Free', tone: 'accent', title: 'IT and security check-up', line: '30 minutes. We look first, then quote.' },
  { img: 'cloud', chip: 'Guide', tone: 'sky', title: 'Windows 10 support has ended', line: 'Your upgrade plan, step by step' },
];
const IMG = { security: '%SECURITY%', cloud: '%CLOUD%' };
const chip = (n) => `<span class="chip chip--${n.tone}">${n.chip}</span>`;
const thumb = (n, inner = '') => `<span class="news-thumb well"><img src="${IMG[n.img]}" alt="" width="640" height="480">${inner}</span>`;
const P = '<span class="sr-only">. </span>';
const CARD = {
  now: (n) => `${thumb(n)}<span class="news-text"><span class="news-title">${n.title}</span>${P}${chip(n)}${P}<span class="small muted">${n.line}</span></span>`,
  a: (n) => `${thumb(n)}<span class="news-text"><span class="news-title">${n.title}</span>${P}${chip(n)}${P}<span class="small muted">${n.line}</span></span>`,
  b: (n) => `${thumb(n)}<span class="news-text"><span class="news-title">${n.title}</span>${P}${chip(n)}${P}<span class="small muted">${n.line}</span></span>`,
  c: (n) => `${thumb(n)}<span class="news-text"><span class="news-title">${n.title}</span>${P}<span class="tag tag--${n.tone}">${n.chip}</span>${P}<span class="small muted">${n.line}</span></span>`,
};
for (const opt of document.querySelectorAll('.opt')) {
  const v = opt.dataset.v;
  for (const dock of opt.querySelectorAll('.dock')) {
    const list = dock.classList.contains('phone') ? NEWS.slice(0, 1) : NEWS;
    dock.innerHTML = list.map((n) => `<a class="card news" href="#">${CARD[v](n)}</a>`).join('');
  }
}
document.addEventListener('click', (e) => { if (e.target.closest('a[href="#"]')) e.preventDefault(); });
const measure = () => {
  for (const opt of document.querySelectorAll('.opt')) {
    const h = (sel) => Math.max(...[...opt.querySelectorAll(`.dock.${sel} .card`)].map((c) => Math.round(c.getBoundingClientRect().height)));
    opt.querySelector('.measure').innerHTML = `Card height: desktop <b>${h('desk')} px</b>, phone <b>${h('phone')} px</b>`;
  }
};
document.fonts.ready.then(measure);
addEventListener('resize', measure);
</script>
</body>
</html>
