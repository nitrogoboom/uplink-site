<script>
function jag(x,y,w,h,a){const p=[],n=Math.max(4,Math.round(w/10)),m=Math.max(2,Math.round(h/10));for(let i=0;i<=n;i++)p.push([x+i*w/n,y-(i%2?a:0)]);for(let i=1;i<=m;i++)p.push([x+w+(i%2?a:0),y+i*h/m]);for(let i=1;i<=n;i++)p.push([x+w-i*w/n,y+h+(i%2?a:0)]);for(let i=1;i<m;i++)p.push([x-(i%2?a:0),y+h-i*h/m]);return'M'+p.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L')+'Z';}
document.querySelectorAll('.jag').forEach(e=>{const[x,y,w,h]=e.dataset.r.split(',').map(Number);e.setAttribute('d',jag(x,y,w,h,3.5));});
</script>
