<section class="section fold" id="proof" aria-labelledby="proof-title">
  <div class="container">
    <div class="section-head">
      <p class="eyebrow">By the numbers</p>
      <h2 id="proof-title">Small team, big coverage</h2>
    </div>
    <ul class="stats stats--4">
      <li class="stat panel"><span class="label">Clients supported</span><span class="stat-val">120+</span><span class="meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></span></li>
      <li class="stat panel"><span class="label">Average first response</span><span class="stat-val">12 min</span><span class="meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span></li>
      <li class="stat panel"><span class="label">Devices looked after</span><span class="stat-val">3,400</span><span class="meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i></i><i></i></span></li>
      <li class="stat panel"><span class="label">Help desk</span><span class="stat-val">In-house</span><span class="meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span></li>
    </ul>
    <div class="panel cta-band" id="start">
      <div class="stack">
        <h2 id="start-title">Start with a free check-up</h2>
        <p class="lead">Thirty minutes, no contract. We show you what we find and what we would fix first.</p>
      </div>
      <div class="row">
        <a class="btn btn--primary btn--lg" href="contact#message" data-open="book-dialog">Book a check-up</a>
        <a class="btn btn--secondary btn--lg" href="tel:+18555550142">1-855-555-0142</a>
      </div>
    </div>
  </div>
</section>
