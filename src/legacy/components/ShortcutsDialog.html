<!--- SHARED · Keyboard shortcuts pop-up (every page)
      Opened with ? or the footer's "Keyboard shortcuts" button.
      Styles: src/styles/dialogs.css.
--->
<dialog class="dialog" id="shortcuts-dialog" aria-labelledby="sc-title">
  <div class="dlg-head">
    <h2 id="sc-title">Keyboard shortcuts</h2>
    <button class="hbtn" type="button" data-close><span class="kbd kbd-hint" aria-hidden="true">Esc</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"/></svg><span class="sr-only">Close</span></button>
  </div>
  <div class="dlg-body">
    <label class="switch" for="sc-toggle">
      <span class="stack-2"><strong>Single-key shortcuts</strong><span class="small muted">Turn off if they clash with a screen reader or voice control.</span></span>
      <input id="sc-toggle" type="checkbox" role="switch" checked>
    </label>
    <section class="keys-group" aria-labelledby="sc-services">
      <h3 class="label" id="sc-services">Services</h3>
      <ul class="keys-list">
        <li><span>Pick a service</span><span class="keys"><span class="kbd">1</span><span class="muted">to</span><span class="kbd" data-svc-max>7</span></span></li>
      </ul>
    </section>
    <section class="keys-group" aria-labelledby="sc-popups">
      <h3 class="label" id="sc-popups">Pop-ups</h3>
      <ul class="keys-list">
        <li><span>Previous or next project <span class="muted">in a project</span></span><span class="keys"><span class="kbd">←</span><span class="kbd">→</span></span></li>
        <li><span>Close</span><span class="keys"><span class="kbd">Esc</span></span></li>
        <li><span>Show this list</span><span class="keys"><span class="kbd">?</span></span></li>
      </ul>
    </section>
    <p class="small muted">Shortcuts pause while you type or while a pop-up is open.</p>
  </div>
</dialog>
